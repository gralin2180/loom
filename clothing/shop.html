<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop — LOOM</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="announce">
      <span>Worldwide shipping</span>
      <span>Free shipping over $89</span>
    </div>
    <header class="site-header">
      <div class="wrap nav">
        <a class="brand" href="index.html">LOOM</a>
        <nav class="nav-links">
          <a class="nav-keep" href="shop.html">Shop</a>
          <a href="fit.html">Size guide</a>
          <a class="cart-pill" href="cart.html">Bag <b data-cart-count>0</b></a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <div class="collection-head">
        <h1 id="collection-title">Shop</h1>
        <p class="meta"><span id="result-count">Showing products</span></p>
      </div>
      <div class="lane-strip filters" id="shop-filters"></div>
      <div class="grid" id="shop-grid"></div>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <p class="note" style="margin: 0">Need size help? Open the size guide on each product.</p>
      </div>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
